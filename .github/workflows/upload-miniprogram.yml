name: 小程序代码上传

# 触发方式：
#   1) 手动：本仓库 Actions 页「Run workflow」，签出 StarCicada 的 main，
#      把当前代码上传为开发版（默认版本号 vYYYY.MM.DD-hotfix.NN，同日两位自增）。
#   2) 自动：StarCicada 仓库的 trigger-runner.yml 在 push / PR / 手动触发时
#      经 repository_dispatch(starcicada_miniprogram) 派发。
#      - push：版本号 vYYYY.MM.DD-hotfix.NN，robot 1，描述取提交标题。
#      - PR：版本号「PR #<编号>」，robot 21-30，描述固定。
# 所有上传都只上传为开发版本，不会提交审核。
#
# 密钥安全（重点）：
#   - 上传密钥来自本仓库 Secret `MINIPROGRAM_PRIVATE_KEY`，只在 workflow 运行时写到
#     `$RUNNER_TEMP/starcicada-secret/private.key`，**永远不落进代码目录**；
#   - 上传前硬校验：代码目录内不得存在 *.key / *.pem / project.private.config.json，
#     且 git 索引里不得包含 .private/、*.key、*.pem；
#   - miniprogram-ci 的 `--pi` 再忽略 .private/**、node_modules/**、.git/** 等；
#   - 本项目没有任何打包/压缩上传步骤，代码包只由 miniprogram-ci 直接构造并上传。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（留空则自动用 v<当天日期>-hotfix.NN）
        required: false
        default: ""
        type: string
      robot:
        description: 机器人编号 1-30（默认 1）
        required: false
        default: "1"
        type: string
      desc:
        description: 版本描述
        required: false
        default: "由 GitHub Actions 自动上传！"
        type: string
  repository_dispatch:
    types: [starcicada_miniprogram]

concurrency:
  group: upload-miniprogram-${{ github.event_name }}
  cancel-in-progress: false

env:
  SOURCE_DIR: ${{ github.workspace }}/source

jobs:
  upload:
    name: 上传小程序
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: 签出 Runner
        uses: actions/checkout@v4

      - name: 签出 StarCicada 代码
        uses: actions/checkout@v4
        with:
          repository: Sakana-1314/StarCicada
          ref: ${{ github.event.client_payload.ref || 'main' }}
          token: ${{ secrets.PAT }}
          path: source
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 计算版本号
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_EVENT: ${{ github.event.client_payload.event_name }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          VERSION_INPUT: ${{ inputs.version }}
          ROBOT_INPUT: ${{ inputs.robot }}
          DESC_INPUT: ${{ inputs.desc }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if [ "$EVENT" = "repository_dispatch" ] && [ "$PAYLOAD_EVENT" = "pull_request" ]; then
            VERSION="PR #${PR_NUMBER}"
            ROBOT=$(( 21 + (PR_NUMBER % 10) ))
            DESC="由 GitHub Actions 自动上传！"
          elif [ "$EVENT" = "repository_dispatch" ]; then
            VERSION="$(bash "$GITHUB_WORKSPACE/scripts/next-version.sh")"
            ROBOT=1
            DESC="$(git log -1 --pretty=%s)"
          else
            VERSION="$VERSION_INPUT"
            [ -n "$VERSION" ] || VERSION="$(bash "$GITHUB_WORKSPACE/scripts/next-version.sh")"
            ROBOT="$ROBOT_INPUT"
            DESC="$DESC_INPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "robot=$ROBOT" >> "$GITHUB_OUTPUT"
          echo "desc=$DESC" >> "$GITHUB_OUTPUT"

      - name: 安装 miniprogram-ci（项目目录之外）
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci"
          npm install --prefix "$RUNNER_TEMP/ci" --no-audit --no-fund miniprogram-ci@2.1.19
          test -x "$RUNNER_TEMP/ci/node_modules/.bin/miniprogram-ci"

      - name: 准备上传密钥（只写 RUNNER_TEMP）
        id: key
        env:
          MINIPROGRAM_PRIVATE_KEY: ${{ secrets.MINIPROGRAM_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_DIR="$RUNNER_TEMP/starcicada-secret"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/private.key"
          printf '%s' "$MINIPROGRAM_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          [ -s "$KEY_PATH" ] || { echo "MINIPROGRAM_PRIVATE_KEY 为空"; exit 1; }
          grep -q "PRIVATE KEY" "$KEY_PATH" || { echo "MINIPROGRAM_PRIVATE_KEY 不是有效 PEM"; exit 1; }

          WORKSPACE="$(realpath "$GITHUB_WORKSPACE")"
          SOURCE="$(realpath "$SOURCE_DIR")"
          KEY_REAL="$(realpath "$KEY_PATH")"
          case "$KEY_REAL" in
            "$WORKSPACE"/*|"$SOURCE"/*) echo "密钥不能位于代码目录：$KEY_REAL"; exit 1 ;;
          esac
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: 密钥与代码包安全检查
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          # 1) 工作区不得出现任何上传密钥 / 私有配置
          if find . -type f \( -name '*.key' -o -name '*.pem' -o -name 'project.private.config.json' \) \
              -not -path './node_modules/*' | grep -q .; then
            echo "代码目录中发现密钥或私有配置，拒绝上传："
            find . -type f \( -name '*.key' -o -name '*.pem' -o -name 'project.private.config.json' \) \
              -not -path './node_modules/*'
            exit 1
          fi

          # 2) git 索引里不得包含密钥 / .private
          if git ls-files | grep -qE '(^|/)\.private/|\.key$|\.pem$'; then
            echo "git 索引中发现密钥文件，拒绝上传"
            git ls-files | grep -E '(^|/)\.private/|\.key$|\.pem$'
            exit 1
          fi

          # 3) 上传目录必须存在关键产物
          cd "$SOURCE_DIR/miniprogram"
          test -f project.config.json
          test -f app.json
          test -d miniprogram_npm/tdesign-miniprogram
          test -d miniprogram_npm/miniprogram-sm-crypto
          echo "安全检查通过：密钥位于项目目录之外，代码目录无密钥"

      - name: 构建 miniprogram_npm（缺失时）
        working-directory: source/miniprogram
        run: |
          set -euo pipefail
          if [ ! -d miniprogram_npm/tdesign-miniprogram ]; then
            npm install --no-audit --no-fund
            "$RUNNER_TEMP/ci/node_modules/.bin/miniprogram-ci" pack-npm \
              --pp "$SOURCE_DIR/miniprogram" \
              --pkp "${{ steps.key.outputs.path }}" \
              --appid "$(jq -r '.appid' project.config.json)"
          fi

      - name: 上传小程序代码
        working-directory: source/miniprogram
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ROBOT: ${{ steps.meta.outputs.robot }}
          DESC: ${{ steps.meta.outputs.desc }}
          KEY_PATH: ${{ steps.key.outputs.path }}
        run: |
          set -euo pipefail
          APPID="$(jq -r '.appid' project.config.json)"
          echo "上传目标 appid=${APPID} version=${VERSION} robot=${ROBOT}"
          "$RUNNER_TEMP/ci/node_modules/.bin/miniprogram-ci" upload \
            --appid "$APPID" \
            --pp "$SOURCE_DIR/miniprogram" \
            --pkp "$KEY_PATH" \
            --uv "$VERSION" \
            --ud "$DESC" \
            --robot "$ROBOT" \
            --threads 1 \
            --enable-es6 --enable-es7 --enable-autoprefixwxss \
            --enable-minify --enable-code-protect \
            --pi \
              "node_modules/**" \
              ".private/**" \
              ".git/**" \
              ".github/**" \
              "project.private.config.json" \
              "package.json" \
              "package-lock.json" \
              "README.md" \
              "docs/**" \
              "scripts/**" \
              "static/resource/**"

      - name: 记录版本 tag（仅 push 自动上传）
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "tag ${VERSION} 已存在，跳过"
            exit 0
          fi
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: 回写上传状态到 StarCicada
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          RUN_ID: ${{ github.run_id }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          state=failure
          if [ "${{ job.status }}" = "success" ]; then state=success; fi
          SHA="$(git -C "$SOURCE_DIR" rev-parse HEAD)"
          JOB_ID="$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(any(.steps[]; .name == "回写上传状态到 StarCicada")) | .id' | head -1)"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID/job/${JOB_ID:-}"
          gh api -X POST "repos/Sakana-1314/StarCicada/statuses/$SHA" \
            -f state="$state" \
            -f context='上传小程序代码（Runner）' \
            -f description="版本 ${VERSION}，由 StarCicada-Runner 代为执行" \
            -f target_url="$RUN_URL"
